<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFix - Cadastro</title>
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body class="auth-body">

  <div class="glow glow-top"></div>
  <div class="glow glow-bottom"></div>

  <div class="auth-card">
    
    <aside class="auth-sidebar">
      <div class="sidebar-top">
        <div class="brand-badge">
          <h1 class="brand-title">
            <span class="brand-smart">SMART</span><span class="brand-fix">FIX</span>
          </h1>
        </div>
        <h2 class="sidebar-welcome">Seja Bem-vindo!</h2>
        <p class="sidebar-desc">
          Crie sua conta no SmartFix para solicitar e acompanhar seus serviços de manutenção.
        </p>
      </div>

      <div class="sidebar-security-badge">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span>Ambiente seguro e criptografado</span>
      </div>
    </aside>

    <main class="auth-form-container">
      
      <div id="pj-warning" class="info-msg hidden">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4m0 4h.01"></path></svg>
        <span><strong>Atenção:</strong> Os dados fornecidos devem ser do representante legal / dono da empresa.</span>
      </div>

      <form id="form-cadastro" autocomplete="off" novalidate>
        
        <!-- CATEGORIA 1: DADOS DO CLIENTE / CONTA -->
        <div class="section-divider">
          <h2 class="section-title" id="lbl-categoria-1">1. Dados da Conta</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
          
          <div class="form-group">
            <label for="tipoUsuario">Tipo de Conta *</label>
            <select id="tipoUsuario" class="input-style">
              <option value="cliente">Sou Cliente</option>
              <option value="parceiro">Sou Parceiro</option>
            </select>
          </div>

          <div class="form-group">
            <label for="nomeCompleto" id="lbl-nome">Nome Completo *</label>
            <input type="text" id="nomeCompleto" placeholder="Ex: João Silva" class="input-style">
            <span class="error-msg" id="err-nomeCompleto"></span>
          </div>

          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" placeholder="seu@email.com" class="input-style">
            <span class="error-msg" id="err-email"></span>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone / WhatsApp *</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" maxlength="15" class="input-style">
            <span class="error-msg" id="err-telefone"></span>
          </div>

          <div class="form-group">
            <label for="documento" id="lbl-documento">CPF *</label>
            <input type="text" id="documento" placeholder="000.000.000-00" maxlength="18" class="input-style">
            <span class="error-msg" id="err-documento"></span>
          </div>

          <div class="form-group">
            <label for="dataNascimento" id="lbl-nascimento">Data Nasc. *</label>
            <input type="date" id="dataNascimento" class="input-style">
            <span class="error-msg" id="err-dataNascimento"></span>
          </div>

          <div class="form-group">
            <label for="senha">Senha *</label>
            <div class="input-wrapper">
              <input type="password" id="senha" placeholder="••••••••" class="input-style pr-10">
              <button type="button" id="btn-toggle-senha" class="btn-toggle-eye" tabindex="-1" title="Mostrar/Ocultar Senha">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="error-msg" id="err-senha"></span>
          </div>

          <div class="form-group">
            <label for="confirmarSenha">Confirmar Senha *</label>
            <div class="input-wrapper">
              <input type="password" id="confirmarSenha" placeholder="••••••••" class="input-style pr-10">
              <button type="button" id="btn-toggle-confirmar" class="btn-toggle-eye" tabindex="-1" title="Mostrar/Ocultar Senha">
                <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="error-msg" id="err-confirmarSenha"></span>
          </div>

        </div>

        <!-- CATEGORIA 2: ENDEREÇO -->
        <div class="section-divider">
          <h2 class="section-title" id="lbl-endereco-titulo">2. Endereço</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
          
          <div class="form-group">
            <label for="cep">CEP *</label>
            <div class="input-wrapper">
              <input type="text" id="cep" placeholder="00000-000" maxlength="9" class="input-style">
              <div id="cep-spinner" class="spinner-cep hidden"></div>
            </div>
            <span class="error-msg" id="err-cep"></span>
          </div>

          <div class="form-group lg:col-span-2">
            <label for="rua" id="lbl-rua">Logradouro / Rua *</label>
            <input type="text" id="rua" placeholder="Preenchido via CEP" readonly class="readonly-input-style">
            <span class="error-msg" id="err-rua"></span>
          </div>

          <div class="form-group">
            <label for="numero">Número *</label>
            <input type="text" id="numero" placeholder="Ex: 123" class="input-style">
            <span class="error-msg" id="err-numero"></span>
          </div>

          <div class="form-group">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apt, Bloco..." class="input-style">
          </div>

          <div class="form-group">
            <label for="bairro">Bairro *</label>
            <input type="text" id="bairro" placeholder="Preenchido via CEP" readonly class="readonly-input-style">
            <span class="error-msg" id="err-bairro"></span>
          </div>

          <div class="form-group">
            <label for="municipio">Município *</label>
            <input type="text" id="municipio" placeholder="Preenchido via CEP" readonly class="readonly-input-style">
            <span class="error-msg" id="err-municipio"></span>
          </div>

          <div class="form-group">
            <label for="uf">UF *</label>
            <input type="text" id="uf" placeholder="UF" readonly class="readonly-input-style uppercase text-center">
            <span class="error-msg" id="err-uf"></span>
          </div>

        </div>

        <div class="submit-wrapper">
          <button type="submit" id="btn-submit" class="btn-submit">
            <span id="btn-text">Finalizar Cadastro</span>
            <div id="btn-spinner" class="spinner-btn hidden"></div>
          </button>
        </div>

        <div class="auth-footer-link">
          <p>Já possui uma conta? <a href="./login.html">Faça login aqui</a></p>
        </div>

      </form>
    </main>
  </div>

  <div id="feedback-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-icon-container" class="modal-icon-container"></div>
      <h3 id="modal-title" class="modal-title"></h3>
      <p id="modal-message" class="modal-message"></p>
      <button id="btn-modal-action" class="btn-submit mt-4"></button>
    </div>
  </div>

  <script type="module" src="../assets/js/cadastro.js"></script>
</body>
</html>
