<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFix - Agendamento de Logística (RF08)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkBg: '#0B0E14',
            darkCard: '#131822',
            darkBorder: '#20293A',
            brandOrange: '#FF6B00',
            brandOrangeHover: '#E05D00'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-white font-sans min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="w-full max-w-2xl bg-darkCard border border-darkBorder rounded-xl shadow-2xl overflow-hidden">
    <div class="p-6 border-b border-darkBorder bg-[#0E121B]">
      <h1 class="text-lg font-bold text-white">RF08 – Agendamento de Coleta / Entrega</h1>
    </div>

    <form id="agendamento-form" class="p-6 space-y-6">
      <div>
        <label class="block text-xs font-bold text-brandOrange uppercase mb-2">1. Modalidade</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="p-3 bg-darkBg border border-brandOrange rounded flex items-center gap-2 cursor-pointer text-xs">
            <input type="radio" name="tipoServico" value="coleta" checked class="accent-brandOrange" />
            Coleta no Endereço
          </label>
          <label class="p-3 bg-darkBg border border-darkBorder rounded flex items-center gap-2 cursor-pointer text-xs">
            <input type="radio" name="tipoServico" value="devolucao" class="accent-brandOrange" />
            Devolução Pós-Reparo
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-brandOrange uppercase mb-2">2. Data</label>
        <input type="date" id="dataAgendamento" required class="w-full bg-darkBg border border-darkBorder text-white p-3 rounded text-sm outline-none focus:border-brandOrange [color-scheme:dark]" />
      </div>

      <div>
        <label class="block text-xs font-bold text-brandOrange uppercase mb-2">3. Janela de Horário</label>
        <div class="grid grid-cols-3 gap-3 text-xs">
          <label class="p-3 bg-darkBg border border-darkBorder rounded cursor-pointer hover:border-brandOrange">
            <input type="radio" name="turnoHorario" value="Manhã (08h às 12h)" checked class="sr-only peer" />
            <span class="block font-bold">🌅 Manhã</span>
            <span class="text-gray-400 text-[10px]">08:00 - 12:00</span>
          </label>
          <label class="p-3 bg-darkBg border border-darkBorder rounded cursor-pointer hover:border-brandOrange">
            <input type="radio" name="turnoHorario" value="Tarde (13h às 17h)" class="sr-only peer" />
            <span class="block font-bold">☀️ Tarde</span>
            <span class="text-gray-400 text-[10px]">13:00 - 17:00</span>
          </label>
          <label class="p-3 bg-darkBg border border-darkBorder rounded cursor-pointer hover:border-brandOrange">
            <input type="radio" name="turnoHorario" value="Noite (18h às 21h)" class="sr-only peer" />
            <span class="block font-bold">🌙 Noite</span>
            <span class="text-gray-400 text-[10px]">18:00 - 21:00</span>
          </label>
        </div>
      </div>

      <div class="bg-darkBg border border-darkBorder p-4 rounded space-y-2 text-xs">
        <div class="flex justify-between text-gray-400">
          <span>📍 Endereço de Coleta:</span>
          <button type="button" id="btn-alterar-endereco" class="text-brandOrange font-bold">Alterar</button>
        </div>
        <p id="endereco-texto" class="text-gray-200">Av. Paulista, 1000 - Apto 42B, Bela Vista - São Paulo / SP</p>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-darkBorder">
        <button type="button" id="btn-cancelar" class="px-4 py-2 bg-darkBg border border-darkBorder text-gray-300 rounded text-xs">Cancelar</button>
        <button type="submit" class="px-6 py-2 bg-brandOrange text-white font-bold rounded text-xs hover:bg-brandOrangeHover">Confirmar Agendamento</button>
      </div>
    </form>
  </div>

  <script type="module" src="/src/agendamento.ts"></script>
</body>
</html>
