<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFix - Emissão de Recibo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkBg: '#0B0E14',
            darkCard: '#131822',
            darkBorder: '#20293A',
            brandOrange: '#FF6B00',
            brandOrangeHover: '#E05D00'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-white font-sans min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="w-full max-w-md bg-darkCard border border-darkBorder rounded-xl p-6 shadow-2xl">
    <h2 class="text-lg font-bold text-brandOrange mb-4 border-b border-darkBorder pb-2">Comprovante de Entrada</h2>
    
    <div class="space-y-3 text-sm">
      <div class="flex justify-between"><span class="text-gray-400">OS:</span><span id="receipt-os" class="font-bold"></span></div>
      <div class="flex justify-between"><span class="text-gray-400">Cliente:</span><span id="receipt-client"></span></div>
      <div class="flex justify-between"><span class="text-gray-400">Aparelho:</span><span id="receipt-device"></span></div>
      <div class="flex justify-between"><span class="text-gray-400">Valor Est.:</span><span id="receipt-price" class="text-brandOrange font-bold"></span></div>
    </div>

    <div class="grid grid-cols-2 gap-3 mt-6">
      <a href="/qrcode.html" class="text-center py-2 bg-darkBg border border-darkBorder text-gray-300 rounded text-xs hover:border-brandOrange">Ver QR Code</a>
      <a href="/agendamento.html" class="text-center py-2 bg-brandOrange text-white rounded text-xs font-bold hover:bg-brandOrangeHover">Agendar Coleta</a>
    </div>
  </div>

  <script type="module" src="/src/emissao.ts"></script>
</body>
</html>
