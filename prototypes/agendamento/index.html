<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFix - Triagem & Orçamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkBg: '#0B0E14',
            darkCard: '#131822',
            darkBorder: '#20293A',
            brandOrange: '#FF6B00',
            brandOrangeHover: '#E05D00'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-white font-sans min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="w-full max-w-xl bg-darkCard border border-darkBorder rounded-xl shadow-2xl p-6">
    <div class="flex justify-between items-center mb-6 border-b border-darkBorder pb-4">
      <h1 class="text-xl font-bold text-brandOrange">SmartFix - Triagem de OS</h1>
      <div class="flex gap-2">
        <a href="/emissao.html" class="text-xs bg-darkBg border border-darkBorder px-3 py-1.5 rounded hover:border-brandOrange">Recibo</a>
        <a href="/qrcode.html" class="text-xs bg-darkBg border border-darkBorder px-3 py-1.5 rounded hover:border-brandOrange">QR Code</a>
        <a href="/agendamento.html" class="text-xs bg-darkBg border border-darkBorder px-3 py-1.5 rounded hover:border-brandOrange">Agendamento</a>
      </div>
    </div>

    <form id="triage-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Número da OS</label>
        <input type="text" id="osNumber" value="OS-2026-8942" required class="w-full bg-darkBg border border-darkBorder text-white p-2.5 rounded text-sm focus:border-brandOrange outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Nome do Cliente</label>
        <input type="text" id="clientName" placeholder="Ex: Gabriel Silva" required class="w-full bg-darkBg border border-darkBorder text-white p-2.5 rounded text-sm focus:border-brandOrange outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Dispositivo</label>
        <input type="text" id="device" placeholder="Ex: iPhone 13 Pro" required class="w-full bg-darkBg border border-darkBorder text-white p-2.5 rounded text-sm focus:border-brandOrange outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Endereço de Coleta/Entrega</label>
        <input type="text" id="address" placeholder="Av. Paulista, 1000 - São Paulo" required class="w-full bg-darkBg border border-darkBorder text-white p-2.5 rounded text-sm focus:border-brandOrange outline-none" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-400 mb-1">Valor do Orçamento (R$)</label>
        <input type="number" id="price" placeholder="450.00" step="0.01" required class="w-full bg-darkBg border border-darkBorder text-white p-2.5 rounded text-sm focus:border-brandOrange outline-none" />
      </div>

      <button type="submit" class="w-full bg-brandOrange hover:bg-brandOrangeHover text-white font-bold py-3 rounded transition shadow-lg mt-2">
        Salvar e Avançar para Recibo
      </button>
    </form>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
