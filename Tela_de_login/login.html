<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFix - Login</title>
    <link rel="stylesheet" href="../assets/css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0b1320; font-family: 'Segoe UI', sans-serif; }
        .login-container { display: flex; width: 900px; height: 550px; background-color: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-sidebar { width: 350px; background-color: #1b4976; color: white; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
        .logo-box { background-color: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 30px; font-weight: 900; font-size: 24px; }
        .logo-box span:nth-child(1) { color: #1b4976; }
        .logo-box span:nth-child(2) { color: #f37021; }
        .login-sidebar h2 { font-size: 28px; margin-bottom: 15px; }
        .login-sidebar p { font-size: 15px; line-height: 1.5; color: #d1d4d7; }
        
        .login-form-area { flex: 1; padding: 50px 60px; display: flex; flex-direction: column; justify-content: center; }
        .login-form-area h1 { color: #1b4976; font-size: 24px; margin-bottom: 5px; }
        .login-form-area > p { color: #6c757d; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #1b4976; margin-bottom: 8px; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-wrapper input:focus { border-color: #f37021; }
        
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 5px; display: block; min-height: 15px; }
        
        #btn-toggle-senha { background: none; border: none; position: absolute; right: 10px; cursor: pointer; color: #6c757d; padding: 5px; display: flex; align-items: center; justify-content: center; }
        
        .btn-primary { width: 100%; background-color: #f37021; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:hover { background-color: #d9621b; }
        .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .form-footer { margin-top: 20px; text-align: center; font-size: 14px; color: #6c757d; }
        .form-footer a { color: #1b4976; text-decoration: none; font-weight: 600; display: block; margin-bottom: 10px; }
        
        /* Estilos do Modal de Feedback */
        .hidden { display: none !important; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-icon-container { margin-bottom: 15px; display: flex; justify-content: center; }
        #modal-title { color: #1b4976; margin-bottom: 10px; font-size: 20px; }
        #modal-message { color: #6c757d; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        #btn-modal-action { color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Sidebar -->
        <div class="login-sidebar">
            <div class="logo-box"><span>SMART</span><span>FIX</span></div>
            <h2>Bem-vindo de volta!</h2>
            <p>Acesse sua conta para solicitar novos reparos ou acompanhar o status dos seus dispositivos.</p>
        </div>

        <!-- Formulário -->
        <div class="login-form-area">
            <h1>ACESSAR CONTA</h1>
            <p>Preencha seus dados para entrar na plataforma.</p>

            <form id="form-login">
                <div class="input-group">
                    <label for="identificador">E-mail ou CPF *</label>
                    <div class="input-wrapper">
                        <input type="text" id="identificador" placeholder="seu@email.com ou 000.000.000-00">
                    </div>
                    <span id="err-identificador" class="error-msg"></span>
                </div>

                <div class="input-group">
                    <label for="senha">Senha *</label>
                    <div class="input-wrapper">
                        <input type="password" id="senha" placeholder="••••••••">
                        <button type="button" id="btn-toggle-senha">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <span id="err-senha" class="error-msg"></span>
                </div>

                <button type="submit" class="btn-primary" id="btn-submit">
                    <svg id="btn-spinner" class="spinner hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"></path></svg>
                    <span id="btn-text">Entrar</span>
                </button>

                <div class="form-footer">
                    <a href="#">Esqueci minha senha</a>
                    <span>Ainda não tem uma conta? <a href="cadastro.html" style="display: inline; color: #1b4976;">Cadastre-se aqui</a></span>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE FEEDBACK -->
    <div id="feedback-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div id="modal-icon-container" class="modal-icon-container"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-message"></p>
            <button id="btn-modal-action">Ação</button>
        </div>
    </div>

    <!-- ORDEM CORRETA DOS SCRIPTS (Sem module) -->
    <!-- 1. Importa a biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Importa a sua configuração que conecta com o banco -->
    <script src="../assets/js/supabase.js"></script>
    <!-- 3. Importa a lógica do login -->
    <script src="../assets/js/login.js"></script>
</body>
</html>
