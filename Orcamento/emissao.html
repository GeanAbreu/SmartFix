<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFix - Documento de Orçamento</title>
  <link rel="icon" href="data:;">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0b1523;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .document-card {
      background-color: #1a2636;
      border: 1px solid #ff5500;
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-doc {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #2d3f55;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .header-doc h1 {
      color: #ff5500;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-doc p {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .badge-status {
      background-color: rgba(255, 85, 0, 0.15);
      color: #ff5500;
      border: 1px solid #ff5500;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .info-section {
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #2d3f55;
      font-size: 0.9rem;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      font-weight: 600;
      color: #ffffff;
    }

    .description-box {
      background-color: #0b1523;
      border: 1px solid #2d3f55;
      border-radius: 6px;
      padding: 12px;
      margin: 16px 0;
    }

    .description-box h3 {
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .description-box p {
      font-size: 0.9rem;
      color: #ffffff;
      line-height: 1.4;
    }

    .total-box {
      background-color: #0b1523;
      border-left: 4px solid #ff5500;
      padding: 16px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      margin-bottom: 24px;
    }

    .total-price {
      color: #ff5500;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn-print {
      flex: 1;
      padding: 10px 16px;
      background-color: #ff5500;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-back {
      padding: 10px 16px;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    @media print {
      body {
        background-color: #ffffff;
        color: #000000;
      }
      .document-card {
        border: none;
        box-shadow: none;
        background-color: #ffffff;
        color: #000000;
      }
      .button-group {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="document-card">
    <div class="header-doc">
      <div>
        <h1>SmartFix</h1>
        <p>Orçamento Técnico de Serviço</p>
      </div>
      <span class="badge-status">Emitido</span>
    </div>

    <div class="info-section">
      <div class="info-row">
        <span class="info-label">Prazo Estimado:</span>
        <span class="info-value" id="docPrazo">---</span>
      </div>
      <div class="info-row">
        <span class="info-label">Mão de Obra:</span>
        <span class="info-value" id="docMaoDeObra">R$ 0,00</span>
      </div>
      <div class="info-row">
        <span class="info-label">Peças:</span>
        <span class="info-value" id="docPecas">R$ 0,00</span>
      </div>
    </div>

    <div class="description-box">
      <h3>Discriminação do Serviço</h3>
      <p id="docDescricao">Nenhum detalhe informado.</p>
    </div>

    <div class="total-box">
      <span style="color: #94a3b8; font-weight: 600;">Valor Total:</span>
      <span class="total-price" id="docTotal">R$ 0,00</span>
    </div>

    <div class="button-group">
      <button id="btnPrint" class="btn-print">Imprimir / Salvar PDF</button>
      <button id="btnVoltar" class="btn-back">Voltar</button>
    </div>
  </div>

  <script type="module" src="/src/emissao.ts"></script>
</body>
</html>
