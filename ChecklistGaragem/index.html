<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem de Sintomas e Checklist</title>
    <link rel="icon" href="data:;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b1320] text-gray-200 font-sans min-h-screen p-6">

    <div class="max-w-5xl mx-auto bg-[#131d31] border border-slate-800 rounded-xl shadow-2xl overflow-hidden p-6">
        
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center pb-4 mb-6 border-b border-orange-500/40">
            <h1 class="text-xl font-bold text-white flex items-center gap-3">
                <i class="fa-solid fa-clipboard-check text-orange-500"></i>
                Triagem de Sintomas e Checklist
            </h1>
            <span class="border border-orange-500/60 text-orange-500 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                Área do Cliente
            </span>
        </div>

        <form id="triageForm" class="space-y-6">
            <!-- Identificação do Dispositivo -->
            <div>
                <h2 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-mobile-screen text-orange-500"></i> Identificação do Dispositivo
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Tipo de Dispositivo</label>
                        <select id="deviceType" class="w-full bg-[#0b1320] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500">
                            <option value="Smartphone">Smartphone</option>
                            <option value="Notebook">Notebook</option>
                            <option value="Tablet">Tablet</option>
                            <option value="Console">Console</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Marca / Modelo</label>
                        <input type="text" id="deviceModel" placeholder="Ex: Samsung S23, iPhone 13" 
                               class="w-full bg-[#0b1320] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Número de Série / IMEI</label>
                        <input type="text" id="deviceSerial" placeholder="Opcional" 
                               class="w-full bg-[#0b1320] border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-orange-500">
                    </div>
                </div>
            </div>

            <!-- Sintomas Relatados -->
            <div>
                <h2 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-orange-500"></i> Sintomas Relatados
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="symptomsContainer"></div>
            </div>

            <!-- Checklist de Entrada -->
            <div>
                <h2 class="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-check text-orange-500"></i> Checklist de Entrada / Acessórios
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="checklistContainer"></div>
            </div>

            <!-- Detalhes Adicionais -->
            <div>
                <label class="block text-xs text-gray-400 font-semibold mb-2">Detalhes ou Observações Adicionais:</label>
                <textarea id="additionalNotes" rows="3" placeholder="Descreva mais sobre o problema ou estado do aparelho..." 
                          class="w-full bg-[#0b1320] border border-slate-700 rounded-lg p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-orange-500"></textarea>
            </div>

            <!-- Botões -->
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button type="button" id="btnCancel" class="px-5 py-2 border border-slate-700 text-gray-300 rounded-lg hover:bg-slate-800 text-sm transition">
                    Cancelar
                </button>
                <button type="submit" class="px-5 py-2 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> Salvar Triagem
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
