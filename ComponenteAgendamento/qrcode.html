<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFix - QR Code de Rastreio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            darkBg: '#0B0E14',
            darkCard: '#131822',
            darkBorder: '#20293A',
            brandOrange: '#FF6B00',
            brandOrangeHover: '#E05D00'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-white font-sans min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="w-full max-w-md bg-darkCard border border-darkBorder rounded-xl p-6 text-center shadow-2xl relative">
    <div class="absolute top-0 left-0 right-0 h-1 bg-brandOrange"></div>
    <h2 class="text-xl font-bold mt-2">QR Code de Rastreio</h2>
    <p class="text-xs text-gray-400 mb-4">Aponte a câmara para visualizar o estado</p>

    <div class="flex justify-center my-4">
      <div class="p-4 bg-white rounded-2xl border-4 border-[#1E2638]">
        <div id="qrcode"></div>
      </div>
    </div>

    <div class="bg-darkBg border border-darkBorder p-3 rounded text-left text-xs space-y-1 mb-4">
      <div class="flex justify-between"><span class="text-gray-400">O.S.:</span><span id="os-number-display" class="font-bold text-brandOrange"></span></div>
      <div class="flex justify-between"><span class="text-gray-400">Dispositivo:</span><span id="device-display"></span></div>
      <div class="pt-2 border-t border-darkBorder">
        <p id="tracking-url" class="truncate text-gray-400 font-mono text-[11px]"></p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button id="btn-copy" class="py-2 bg-darkBg border border-darkBorder text-gray-300 rounded text-xs">Copiar Link</button>
      <button id="btn-print" class="py-2 bg-brandOrange text-white rounded text-xs font-bold">Imprimir Etiqueta</button>
    </div>
  </div>

  <script type="module" src="/src/qrcode.ts"></script>
</body>
</html>
